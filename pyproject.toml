[project]
name = "bilig"
version = "0.1.0"
description = ""
authors = [
    {name = "Thibault Lanternier",email = "thibault.lanternier@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click (>=8.3.2,<9.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "sentence-transformers (>=5.4.1,<6.0.0)",
    "jupyterlab (>=4.5.6,<5.0.0)"
]

[tool.poetry]
packages = [{include = "bilig", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
